<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AX tasks</title>
<link rel="icon" href="/axel.svg">
<style>
  :root {
    /* From the axel logo: pink #eea0bb, deep pink #e4769d, blush #f5dce2, on black. */
    --bg: #0d0b0c; --panel: #151214; --card: #1c181a; --line: #322a2e;
    --text: #f5eef0; --dim: #a69ba0; --faint: #6e6368; --accent: #eea0bb; --steer: #e4769d;
    --ok: #5cc392; --warn: #e8b84a; --err: #f06a6a; --back: #f0975a; --pink: #eea0bb; --blush: #f5dce2;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 20px;
           border-bottom: 1px solid var(--line); }
  header img { height: 44px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .01em; white-space: nowrap; }
  header h1 span { color: var(--pink); }
  header .sub { color: var(--dim); flex: 1; font-size: 13px; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border-color: transparent; color: var(--dim); padding: 6px 12px; white-space: nowrap; }
  nav button.on { color: var(--text); border-color: var(--line); background: var(--card); }
  header .sub code { font-family: var(--mono); color: var(--text); }
  button { background: var(--card); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .busy { color: var(--warn); font-family: var(--mono); font-size: 12px; }

  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #canvas { position: relative; overflow: auto; }
  #stage { position: relative; margin: 28px auto; }
  #edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  #edges path { fill: none; stroke: var(--line); stroke-width: 2; }
  #edges path.live { stroke: #5a3f4b; }
  #edges path.target { stroke: var(--steer); }
  #edges path.flow { stroke: var(--steer); stroke-dasharray: 6 6; animation: flow .6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }

  .node { position: absolute; width: 230px; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .2s, box-shadow .2s, opacity .3s; }
  .node:hover { border-color: #54474d; }
  .node.selected { border-color: #fff; }
  .node.target { box-shadow: 0 0 0 2px #ffffffb3 inset; }
  .node.pending { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 2px #fff inset, 0 0 22px #ffffff59; } }
  .node.idle { opacity: .5; }
  .node.idle:hover { opacity: .8; }
  .node.failed { border-color: var(--err); }
  .node .top .pill { margin-left: auto; }
  .node .top { display: flex; align-items: center; gap: 6px; }
  .node .top { flex-wrap: wrap; }
  .node .name { font-weight: 600; font-family: var(--mono); flex: 1 0 100%; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; margin-bottom: 4px; }
  .pill { font-size: 10.5px; padding: 2px 8px; border-radius: 99px; background: #2a2427; color: var(--dim);
          text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .pill.work { background: #3b2530; color: var(--accent); }
  .pill.ok { background: #173a2b; color: var(--ok); }
  .pill.wait { background: #3a3117; color: var(--warn); }
  .pill.bad { background: #3d1c1c; color: var(--err); }
  .pill.back { background: #3d2717; color: var(--back); }
  .act { font-size: 11px; padding: 1px 7px; white-space: nowrap; border-radius: 5px; line-height: 18px; color: var(--dim); }
  .act:hover:not(:disabled) { color: var(--text); }
  .goal { color: var(--dim); margin: 4px 0 6px; font-size: 13px; }
  .bar { height: 4px; background: #2a2427; border-radius: 2px; overflow: hidden; margin: 6px 0 4px; }
  .bar div { height: 100%; background: var(--accent); transition: width .6s ease; }
  .bar.ok div { background: var(--ok); } .bar.bad div { background: var(--err); }
  .bar.back div { background: var(--back); } .bar.wait div { background: var(--warn); }
  .detail { font-size: 12.5px; margin-bottom: 6px; }
  .detail.bad { color: var(--err); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .chips:empty { display: none; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: #3d1f2c; color: var(--blush); }
  .chip.new { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(.6); background: var(--steer); color: #000; } }
  .ident { font-family: var(--mono); font-size: 10.5px; color: var(--faint); border-top: 1px dashed var(--line);
           padding-top: 6px; margin-top: 2px; line-height: 1.5; }
  .ident b { color: var(--dim); font-weight: 500; }
  .ident.grid { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; }
  .ident span { overflow-wrap: anywhere; }
  .commits { font-family: var(--mono); font-size: 11px; background: #141113; border-radius: 6px;
             padding: 6px 8px; margin-bottom: 6px; }
  .commits div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .commits div + div { margin-top: 2px; }
  .commits code { color: var(--faint); margin-right: 4px; }
  .who { font-weight: 600; }
  .who.antigravity, .lane .antigravity { color: #8ab4f8; }
  .who.claude-code, .lane .claude-code { color: #d97757; }
  .who.workspace { color: var(--blush); }
  .lane { position: absolute; font-size: 12px; }
  .lane .ws { text-align: center; color: var(--dim); font-size: 11.5px; padding: 6px 0 10px;
              border-bottom: 1px dashed var(--line); margin-bottom: 8px; }
  .lane .ws b { font-family: var(--mono); color: var(--blush); font-weight: 500; }
  .lane .empty { color: var(--faint); text-align: center; padding-top: 6px; }
  .hand { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
          margin-bottom: 8px; width: 88%; }
  .hand.r2l { margin-left: auto; }
  .hand.new { animation: pop .5s ease-out; }
  .hand .meta { font-family: var(--mono); font-size: 10.5px; color: var(--faint); display: flex; gap: 6px; white-space: nowrap; }
  .hand .meta .file { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .hand .text { margin-top: 2px; }
  .log { font-family: var(--mono); font-size: 11px; color: var(--dim); background: #141113;
         border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
  .log div + div { margin-top: 3px; }
  .log div:not(:last-child) { opacity: .6; }
  .log .steered { color: var(--steer); }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
             margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #activity { overflow: auto; padding: 8px 16px; font-family: var(--mono); font-size: 11.5px; flex: 1; }
  #activity div { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
  #activity .t { color: var(--faint); margin-right: 8px; }
  #activity .cmd { color: var(--accent); }
  #activity .out { color: var(--dim); }
  #activity .ok { color: var(--ok); }
  #activity .err { color: var(--err); }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 20px;
           display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  footer .label { color: var(--dim); }
  footer .label b { color: var(--steer); font-family: var(--mono); }
  footer input { flex: 1; min-width: 220px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                 border-radius: 6px; padding: 8px 12px; font: inherit; }
  footer input:focus { outline: none; border-color: #fff; }
  .preset { font-size: 12px; padding: 5px 10px; color: var(--steer); }
</style>
</head>
<body>
<header>
  <img src="/axel.svg" alt="axel, the AX axolotl">
  <h1><span>AX</span> tasks</h1>
  <nav id="tabs"></nav>
  <span class="sub" id="sub"></span>
  <span class="busy" id="busy"></span>
  <button id="up" class="primary">Start</button>
  <button id="down">Tear down</button>
</header>
<main>
  <div id="canvas"><div id="stage"><svg id="edges"></svg></div></div>
  <aside><h2>Activity</h2><div id="activity"></div></aside>
</main>
<footer>
  <span class="label">Steer <b id="target">–</b><span id="count"></span></span>
  <input id="msg" placeholder="message" autocomplete="off">
  <span id="presets"></span>
  <button id="send" class="primary">Steer</button>
</footer>

<script>
const HGAP = 30, VGAP = 22, LANE = 380;
// Gates get narrower boxes than deploys, so the long chain fits; collaborating
// agents get wider ones, for their git history.
const width = n => n.kind === "gate" ? 180 : ["fixer", "tester"].includes(n.kind) ? 300 : 230;
const $ = id => document.getElementById(id);
// demo is the tab on screen: a script on the server, named in the URL hash.
let demo = location.hash.slice(1), nodes = [], selected = null, busy = null, presets = null;
// pending[name] = {msg, seen}: a steering message on its way to that task,
// and how many times the task had already received it when it was sent.
const pending = {};
// transit[name] = the AX state a suspend or resume was asked from; the button
// stays disabled until the task leaves it.
const transit = {};
// Chips already on screen, so only newly received steering animates.
const shown = new Set();

const byName = name => nodes.find(n => n.name === name);
const children = name => nodes.filter(n => n.parents.includes(name)).map(n => n.name);
const subtree = name => [...new Set([name, ...children(name).flatMap(subtree)])];
const isRunning = s => s === "Running" || s === "Working";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const count = (arr, x) => arr.filter(y => y === x).length;

// phase is what a box reports: the agent's own phase when it has one, else
// the AX task state. A task that has never run is PENDING, or SKIPPED once its
// parent can no longer finish; one that ran and stopped is SUSPENDED.
function phase(n) {
  if (n.state === "Absent") return "ABSENT";
  if (!isRunning(n.state)) {
    if (n.started) return "SUSPENDED";
    const stuck = n.parents.some(p => ["FAILED", "ROLLING_FORWARD", "ROLLED_FORWARD", "ABORTED", "SKIPPED"].includes(phase(byName(p))));
    return stuck ? "SKIPPED" : "PENDING";
  }
  return n.status?.phase || (n.log.length ? "RUNNING" : "STARTING");
}
const TONE = {DEPLOYING: "work", BAKING: "work", VERIFYING: "work", GATING: "work", VALIDATING: "work", STARTING: "work", RUNNING: "ok", DONE: "ok",
              PAUSED: "wait", SUSPENDED: "wait", FAILED: "bad", ROLLING_FORWARD: "back", ROLLED_FORWARD: "back", ABORTED: "wait",
              READING: "work", REPRODUCING: "work", FIXING: "work", WRITING_TESTS: "work", TESTING: "work", REVIEWING: "work",
              WAITING: "wait"};
// peers: tasks that work side by side rather than in a tree.
const peers = () => nodes.length > 1 && nodes.every(n => !n.parents.length);

// layout is left to right: a stage sits one column right of its deepest
// parent. Leaves are stacked top to bottom and every parent is centered on its
// children; a stage that joins several parents is centered on them instead.
// Heights come from the rendered boxes.
function layout(root, heights) {
  if (peers()) {
    // Two agents, with the lane of handoffs between them.
    let x = 0;
    return Object.fromEntries(nodes.map((n, i) => {
      const p = [n.name, {x, y: 0, h: heights[n.name]}];
      x += width(n) + (i === 0 ? LANE : HGAP);
      return p;
    }));
  }
  const depth = {};
  for (const n of nodes) depth[n.name] = Math.max(-1, ...n.parents.map(p => depth[p])) + 1;
  const colW = [], colX = [0];
  for (const n of nodes) colW[depth[n.name]] = Math.max(colW[depth[n.name]] || 0, width(n));
  colW.forEach((w, i) => colX[i + 1] = colX[i] + w + HGAP);

  const pos = {}, joins = nodes.filter(n => n.parents.length > 1);
  const mid = p => p.y + p.h / 2;
  let y = 0;
  (function place(name) {
    const kids = children(name).filter(k => byName(k).parents.length === 1);
    kids.forEach(place);
    const h = heights[name];
    let top;
    if (kids.length) top = (mid(pos[kids[0]]) + mid(pos[kids.at(-1)])) / 2 - h / 2;
    else { top = y; y += h + VGAP; }
    pos[name] = {x: colX[depth[name]], y: top, h};
  })(root);
  for (const n of joins) {
    const h = heights[n.name], ys = n.parents.map(p => mid(pos[p]));
    pos[n.name] = {x: colX[depth[n.name]], y: ys.reduce((a, b) => a + b) / ys.length - h / 2, h};
  }
  const minY = Math.min(...Object.values(pos).map(p => p.y));
  Object.values(pos).forEach(p => p.y -= minY);
  return pos;
}

// action is the suspend/resume button for a box.
function action(n) {
  if (n.state === "Absent") return "";
  if (transit[n.name]) return `<button class="act" disabled>${isRunning(transit[n.name]) ? "suspending" : "resuming"}…</button>`;
  return isRunning(n.state)
    ? `<button class="act" data-op="suspend" title="ax suspend task ${esc(n.name)}">⏸ suspend</button>`
    : `<button class="act" data-op="resume" title="ax resume task ${esc(n.name)}">▶ resume</button>`;
}

// identity is the task's own actor and the policy AX applied to it: the
// gateway that is its egress policy, and its sandbox limits.
function identity(n, id) {
  const where = id.worker && isRunning(n.state) ? `worker ${id.worker}` : "";
  return `
      <b>actor</b><span title="${esc(where)}">${esc(id.actor)}</span>
      <b>uid</b><span>${esc(id.actorUid.slice(0, 8) || "–")}</span>
      ${id.workspace ? `<b>workspace</b><span>${esc(id.workspace)}</span>` : ""}
      <b>egress</b><span>${esc(id.gateway || "none")}</span>
      <b>limits</b><span>${id.cpu ? `${esc(id.cpu)} cpu · ${esc(id.memory)}` : "default"}</span>`;
}

function card(n, targets) {
  const ph = phase(n), tone = TONE[ph] || "", st = n.status, id = n.identity;
  const el = document.createElement("div");
  el.className = ["node", n.name === selected && "selected", targets.has(n.name) && "target",
                  pending[n.name] && "pending", ["ABSENT", "PENDING", "SKIPPED", "SUSPENDED"].includes(ph) && "idle",
                  ph === "FAILED" && "failed"].filter(Boolean).join(" ");
  const chips = n.steer.map((s, i) => {
    const key = `${n.name}#${i}#${s}`, fresh = !shown.has(key);
    shown.add(key);
    return `<span class="chip${fresh ? " new" : ""}">${esc(s)}</span>`;
  }).join("");
  const commits = n.commits.slice(0, 4).map(c =>
    `<div title="${esc(c.subject)}"><code>${esc(c.hash)}</code><span class="who ${c.author === "Antigravity" ? "antigravity" : c.author === "Claude Code" ? "claude-code" : "workspace"}">${esc(c.author)}</span> ${esc(c.subject)}</div>`).join("");
  const log = st ? "" : n.log.slice(-2).map(l =>
    `<div class="${l.text.startsWith("STEERED") ? "steered" : ""}">${esc(l.time)} ${esc(l.text)}</div>`).join("");
  el.innerHTML = `
    <div class="top"><span class="name">${esc(n.name)}</span>${action(n)}<span class="pill ${tone}">${esc(ph.replaceAll("_", " "))}</span></div>
    <div class="goal">${esc(n.goal)}</div>
    ${st && st.pct != null ? `<div class="bar ${tone}"><div style="width:${st.pct}%"></div></div>` : ""}
    ${st ? `<div class="detail ${tone === "bad" ? "bad" : ""}">${esc(st.detail)}</div>` : ""}
    ${log ? `<div class="log">${log}</div>` : ""}
    ${commits ? `<div class="commits">${commits}</div>` : ""}
    <div class="chips">${chips}</div>
    <div class="ident${id ? " grid" : ""}">${id ? identity(n, id) : `<div>${n.state === "Absent" ? "task not created" : "reading identity…"}</div>`}</div>`;
  el.style.width = width(n) + "px";
  el.onclick = () => { selected = n.name; render(); };
  const btn = el.querySelector("button[data-op]");
  if (btn) btn.onclick = e => { e.stopPropagation(); suspendResume(n, btn.dataset.op); };
  return el;
}

function render() {
  if (!nodes.length) return;
  const root = nodes.find(n => !n.parents.length).name;
  selected ??= root;
  const targets = new Set(subtree(selected));
  const stage = $("stage"), svg = $("edges");
  stage.querySelectorAll(".node, .lane").forEach(e => e.remove());

  const els = {}, heights = {};
  for (const n of nodes) {
    els[n.name] = card(n, targets);
    stage.appendChild(els[n.name]);
    heights[n.name] = els[n.name].offsetHeight;
  }
  const pos = layout(root, heights);
  for (const n of nodes) {
    els[n.name].style.left = pos[n.name].x + "px";
    els[n.name].style.top = pos[n.name].y + "px";
  }

  let h = Math.max(...Object.values(pos).map(p => p.y + p.h));
  if (peers()) h = Math.max(h, lane(stage, pos));
  const w = Math.max(...nodes.map(n => pos[n.name].x + width(n)));
  stage.style.width = w + "px"; stage.style.height = h + "px";
  svg.setAttribute("width", w); svg.setAttribute("height", h);
  svg.innerHTML = nodes.flatMap(n => n.parents.map(p => {
    const a = pos[p], b = pos[n.name];
    const x1 = a.x + width(byName(p)), y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, mx = (x1 + x2) / 2;
    const cls = pending[n.name] ? "flow" : targets.has(n.name) && targets.has(p) ? "target"
              : isRunning(n.state) ? "live" : "";
    return `<path class="${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  })).join("");

  $("target").textContent = selected;
  $("count").textContent = targets.size > 1 ? ` + subtree (${targets.size} tasks)` : "";
  $("busy").textContent = busy ? `⏳ ${busy}…` : "";
  $("up").disabled = !!busy || nodes.every(n => n.state !== "Absent");
  $("down").disabled = !!busy || nodes.every(n => n.state === "Absent");
  $("send").disabled = !nodes.some(n => isRunning(n.state));
}

// lane draws the handoffs between two peer agents, oldest first, in the gap
// between their boxes, under the workspace they share. It returns its height.
function lane(stage, pos) {
  const [a, b] = nodes, el = document.createElement("div");
  const hands = nodes.flatMap(n => n.handoffs.map(h => ({...h, from: n.name})))
    .sort((x, y) => x.time.localeCompare(y.time));
  const ws = nodes.map(n => n.identity?.workspace).find(Boolean);
  el.className = "lane";
  el.style.left = pos[a.name].x + width(a) + HGAP + "px";
  el.style.width = LANE - 2 * HGAP + "px";
  el.innerHTML = `
    <div class="ws">${ws ? `both start from workspace <b>${esc(ws)}</b>` : "workspace not created"}</div>
    ${hands.map(h => {
      const key = `hand#${h.from}#${h.time}#${h.text}`, fresh = !shown.has(key);
      shown.add(key);
      const m = h.text.match(/^(.*) \((\S+\.patch)\)$/), text = m ? m[1] : h.text;
      return `<div class="hand ${h.from === a.name ? "l2r" : "r2l"}${fresh ? " new" : ""}">
        <div class="meta"><span class="${esc(h.from)}">${esc(h.from)} → ${esc(h.to)}</span>
          <span class="file">${m ? esc(m[2]) : "note"}</span></div>
        <div class="text">${esc(text)}</div></div>`;
    }).join("") || `<div class="empty">handoffs between the agents show up here</div>`}`;
  stage.appendChild(el);
  return el.offsetHeight;
}

function renderActivity(items) {
  const box = $("activity"), atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 10;
  box.innerHTML = items.map(a => `<div class="${a.kind}"><span class="t">${a.time}</span>${esc(a.text)}</div>`).join("");
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function renderPresets(list) {
  presets = list;
  $("presets").innerHTML = list.map(p => `<button class="preset">${esc(p)}</button>`).join(" ");
  $("presets").querySelectorAll("button").forEach(b => b.onclick = () => steer(b.textContent));
  $("msg").placeholder = list.length ? `e.g. ${list[0]}` : "message";
}

async function refresh() {
  try {
    const want = demo, s = await (await fetch(`/api/state?demo=${encodeURIComponent(demo)}`)).json();
    if (want !== demo) return;  // the tab changed while this was in flight
    demo = s.key; nodes = s.nodes; busy = s.busy;
    if (!presets) {
      renderPresets(s.presets);
      $("sub").innerHTML = `<code>${esc(s.script)}</code> in atespace <code>${esc(s.atespace)}</code>. ${esc(s.about)}`;
    }
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.key === demo));
    for (const n of nodes) {
      // A message has arrived once the task has received it one more time than before.
      const p = pending[n.name];
      if (p && (count(n.steer, p.msg) > p.seen || !isRunning(n.state))) delete pending[n.name];
      if (transit[n.name] && isRunning(transit[n.name]) !== isRunning(n.state)) delete transit[n.name];
    }
    render(); renderActivity(s.activity);
  } catch (e) { $("busy").textContent = "server unreachable"; }
}

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
                               body: JSON.stringify({demo, ...body})});
  refresh();
  return r.ok;
}

async function suspendResume(n, op) {
  transit[n.name] = n.state;
  setTimeout(() => { delete transit[n.name]; render(); }, 90000);  // give up if it never changes
  render();
  if (!await post("/api/task", {node: n.name, op})) delete transit[n.name];
}

async function steer(msg) {
  msg = msg.trim();
  if (!msg || !selected) return;
  if (await post("/api/steer", {node: selected, msg})) {
    for (const name of subtree(selected)) {
      const n = byName(name);
      if (isRunning(n.state)) pending[name] = {msg, seen: count(n.steer, msg)};
    }
    $("msg").value = "";
    render();
  }
}

$("up").onclick = () => post("/api/up");
$("down").onclick = () => confirm("Delete every task in this demo?") && post("/api/down");
$("send").onclick = () => steer($("msg").value);
$("msg").onkeydown = e => e.key === "Enter" && steer($("msg").value);

// show switches to another demo's tab and starts it from a clean slate.
function show(key) {
  demo = key; history.replaceState(null, "", "#" + key);
  nodes = []; selected = null; presets = null;
  for (const o of [pending, transit]) for (const k in o) delete o[k];
  $("stage").querySelectorAll(".node, .lane").forEach(e => e.remove());
  $("edges").innerHTML = ""; $("activity").innerHTML = "";
  refresh();
}

(async () => {
  const demos = await (await fetch("/api/demos")).json();
  $("tabs").innerHTML = demos.length > 1
    ? demos.map(d => `<button data-key="${esc(d.key)}">${esc(d.title)}</button>`).join("") : "";
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.key));
  if (!demos.some(d => d.key === demo)) demo = demos[0].key;
  refresh();
  setInterval(refresh, 1500);
})();
</script>
